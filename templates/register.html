{% extends "base.html" %}

{% block title %}WorkSphere AI - Employee Registration{% endblock %}

{% block content %}
<div class="auth-page-wrapper">
    <div class="auth-glass-box" style="max-width: 580px;">
        <div class="auth-header">
            <div class="auth-icon-circle">
                <i class="fa-solid fa-user-plus"></i>
            </div>
            <h2 class="auth-title">Register Employee</h2>
            <p class="auth-subtitle">Create a corporate profile in the WorkSphere system</p>
        </div>

        {% if error %}
        <div style="background: #fef2f2; border: 1px solid #fecaca; color: #b91c1c; padding: 12px; border-radius: 8px; margin-bottom: 18px; font-size: 13px; font-weight: 600; display: flex; align-items: center; gap: 8px;">
            <i class="fa-solid fa-triangle-exclamation"></i> {{ error }}
        </div>
        {% endif %}

        <form method="POST" action="/register">
            <div class="form-row-2">
                <div class="form-group">
                    <label class="form-label" for="name"><i class="fa-solid fa-id-badge"></i> Full Name</label>
                    <input type="text" id="name" name="name" class="form-input" placeholder="e.g. Rahul Sharma" required>
                </div>

                <div class="form-group">
                    <label class="form-label" for="username"><i class="fa-solid fa-user"></i> Username</label>
                    <input type="text" id="username" name="username" class="form-input" placeholder="e.g. rahul.sharma" required>
                </div>
            </div>

            <div class="form-row-2">
                <div class="form-group">
                    <label class="form-label" for="password"><i class="fa-solid fa-lock"></i> Password</label>
                    <input type="password" id="password" name="password" class="form-input" placeholder="Create password" required>
                </div>

                <div class="form-group">
                    <label class="form-label" for="contact"><i class="fa-solid fa-phone"></i> Contact Number</label>
                    <input type="text" id="contact" name="contact" class="form-input" placeholder="+91 98XXX XXXXX" required>
                </div>
            </div>

            <div class="form-row-2">
                <div class="form-group">
                    <label class="form-label" for="position"><i class="fa-solid fa-briefcase"></i> Designation / Post</label>
                    <input type="text" id="position" name="position" class="form-input" placeholder="e.g. Senior Software Engineer" required>
                </div>

                <div class="form-group">
                    <label class="form-label" for="department"><i class="fa-solid fa-sitemap"></i> Department</label>
                    <select id="department" name="department" class="form-select">
                        <option value="Engineering & Technology">Engineering & Technology</option>
                        <option value="Product & Design">Product & Design</option>
                        <option value="Cloud & Infrastructure">Cloud & Infrastructure</option>
                        <option value="Data Science & AI Labs">Data Science & AI Labs</option>
                        <option value="People & Culture (HR)">People & Culture (HR)</option>
                        <option value="Quality Assurance">Quality Assurance</option>
                    </select>
                </div>
            </div>

            <div class="form-group">
                <label class="form-label" for="location"><i class="fa-solid fa-location-dot"></i> Base Office Location</label>
                <select id="location" name="location" class="form-select">
                    <option value="Bengaluru, India">Bengaluru Hub (Tech Park)</option>
                    <option value="Mumbai, India">Mumbai (Corporate Towers)</option>
                    <option value="Gurugram, India">Gurugram (Cyber City)</option>
                    <option value="Pune, India">Pune (IT Hub)</option>
                    <option value="Hyderabad, India">Hyderabad (HITEC City)</option>
                    <option value="Chennai, India">Chennai (OMR Campus)</option>
                </select>
            </div>

            <button type="submit" class="btn-submit-primary" style="margin-top: 14px;">
                <i class="fa-solid fa-check"></i> Complete Registration & Activate Profile
            </button>
        </form>

        <div class="auth-footer">
            Already registered? <a href="/login">Sign in directly</a>
        </div>
    </div>
</div>
{% endblock %}
