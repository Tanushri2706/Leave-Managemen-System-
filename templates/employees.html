{% extends "base.html" %}

{% block title %}Employees{% endblock %}

{% block content %}
<style>
    .employee-page {
        margin: 100px auto 40px;
        max-width: 1100px;
        padding: 32px;
        border-radius: 28px;
        background: rgba(255, 255, 255, 0.78);
        border: 1px solid rgba(148, 163, 184, 0.32);
        box-shadow: 0 18px 40px rgba(15, 23, 42, 0.08);
        backdrop-filter: blur(16px);
    }

    .employee-heading {
        text-align: center;
        margin-bottom: 28px;
        color: #0f172a;
        font-size: 32px;
        font-weight: 700;
    }

    .employee-table {
        width: 100%;
        border-collapse: collapse;
        background: rgba(255, 255, 255, 0.9);
        border-radius: 20px;
        overflow: hidden;
        box-shadow: 0 10px 28px rgba(15, 23, 42, 0.08);
        backdrop-filter: blur(12px);
    }

    .employee-table th,
    .employee-table td {
        padding: 18px 16px;
        text-align: left;
        border-bottom: 1px solid rgba(148, 163, 184, 0.18);
    }

    .employee-table th {
        background: rgba(241, 245, 249, 0.95);
        color: #0f172a;
        font-size: 15px;
        font-weight: 700;
    }

    .employee-table tr:hover {
        background: rgba(238, 242, 255, 0.75);
    }

    .employee-table td {
        color: #334155;
        font-size: 15px;
    }

    .employee-table a {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        padding: 10px 16px;
        border-radius: 9999px;
        background: rgba(37, 99, 235, 0.12);
        color: #1d4ed8;
        text-decoration: none;
        font-weight: 600;
        transition: background 0.2s ease, transform 0.2s ease;
    }

    .employee-table a:hover {
        background: rgba(37, 99, 235, 0.2);
        transform: translateY(-1px);
    }

    @media (max-width: 900px) {
        .employee-page {
            margin: 90px 16px 30px;
            padding: 28px;
        }

        .employee-table th,
        .employee-table td {
            padding: 14px 12px;
        }
    }
</style>

<div class="employee-page">
    <h2 class="employee-heading">Employees</h2>

    <table class="employee-table">
        <tr>
            <th>Name</th>
            <th>Position</th>
            <th>Contact</th>
            <th>Details</th>
        </tr>

        {% for emp in employees %}
        <tr>
            <td>{{ emp.name }}</td>
            <td>{{ emp.position }}</td>
            <td>{{ emp.contact }}</td>
            <td><a href="/employee/{{ emp._id }}">More Details</a></td>
        </tr>
        {% endfor %}
    </table>
</div>

{% endblock %}
